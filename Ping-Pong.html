<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #08101a;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .scoreboard {
      width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }

    #gameCanvas {
      border: 4px solid #dfe7ff;
      background: #0c1220;
      display: block;
      box-shadow: 0 0 18px rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>
  <div class="scoreboard">
    <div id="scoreLeft">0</div>
    <div id="scoreRight">0</div>
  </div>

  <canvas id="gameCanvas" width="900" height="500"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreLeftEl = document.getElementById("scoreLeft");
    const scoreRightEl = document.getElementById("scoreRight");

    const paddleWidth = 14;
    const paddleHeight = 90;
    const paddleSpeed = 7;
    const ballRadius = 10;

    const leftPaddle = {
      x: 20,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      score: 0
    };

    const rightPaddle = {
      x: canvas.width - 20 - paddleWidth,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      score: 0
    };

    let ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: ballRadius,
      vx: 0,
      vy: 0
    };

    const keys = {
      ArrowUp: false,
      ArrowDown: false
    };

    function resetBall(direction) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;

      const angle = (Math.random() * 1.2) - 0.6;
      const speed = 5.8;

      ball.vx = direction * speed * Math.cos(angle);
      ball.vy = speed * Math.sin(angle);

      if (Math.abs(ball.vx) < 3) {
        ball.vx = direction * 5;
      }
    }

    function updateLeftPaddle() {
      if (keys.ArrowUp) {
        leftPaddle.y -= paddleSpeed;
      }
      if (keys.ArrowDown) {
        leftPaddle.y += paddleSpeed;
      }

      leftPaddle.y = Math.max(0, Math.min(canvas.height - leftPaddle.height, leftPaddle.y));
    }

    function updateRightPaddle() {
      const targetY = ball.y - rightPaddle.height / 2;
      rightPaddle.y += (targetY - rightPaddle.y) * 0.09;
      rightPaddle.y = Math.max(0, Math.min(canvas.height - rightPaddle.height, rightPaddle.y));
    }

    function handlePaddleCollision(paddle, side) {
      const paddleLeft = paddle.x;
      const paddleRight = paddle.x + paddle.width;
      const paddleTop = paddle.y;
      const paddleBottom = paddle.y + paddle.height;

      const overlaps =
        ball.x + ball.radius > paddleLeft &&
        ball.x - ball.radius < paddleRight &&
        ball.y + ball.radius > paddleTop &&
        ball.y - ball.radius < paddleBottom;

      if (!overlaps) return;

      const isLeftPaddle = side === "left";
      const movingTowardPaddle = isLeftPaddle ? ball.vx < 0 : ball.vx > 0;

      if (!movingTowardPaddle) return;

      const relativeIntersectY = (ball.y - (paddle.y + paddle.height / 2)) / (paddle.height / 2);
      const bounceAngle = relativeIntersectY * (Math.PI / 3);

      const speed = Math.hypot(ball.vx, ball.vy) + 0.5;
      const direction = isLeftPaddle ? 1 : -1;

      ball.vx = direction * speed * Math.cos(bounceAngle);
      ball.vy = speed * Math.sin(bounceAngle);

      if (isLeftPaddle) {
        ball.x = paddleLeft + paddle.width + ball.radius;
      } else {
        ball.x = paddleRight - ball.radius;
      }
    }

    function updateBall() {
      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.y - ball.radius <= 0) {
        ball.y = ball.radius;
        ball.vy *= -1;
      } else if (ball.y + ball.radius >= canvas.height) {
        ball.y = canvas.height - ball.radius;
        ball.vy *= -1;
      }

      handlePaddleCollision(leftPaddle, "left");
      handlePaddleCollision(rightPaddle, "right");

      if (ball.x - ball.radius <= 0) {
        rightPaddle.score++;
        scoreRightEl.textContent = rightPaddle.score;
        resetBall(1);
      } else if (ball.x + ball.radius >= canvas.width) {
        leftPaddle.score++;
        scoreLeftEl.textContent = leftPaddle.score;
        resetBall(-1);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Background
      ctx.fillStyle = "#0c1220";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Middle dashed line
      ctx.setLineDash([12, 12]);
      ctx.strokeStyle = "#dfe7ff";
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Paddles
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(leftPaddle.x, leftPaddle.y, leftPaddle.width, leftPaddle.height);
      ctx.fillRect(rightPaddle.x, rightPaddle.y, rightPaddle.width, rightPaddle.height);

      // Ball
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#ffdc5e";
      ctx.fill();
    }

    function gameLoop() {
      updateLeftPaddle();
      updateRightPaddle();
      updateBall();
      draw();

      requestAnimationFrame(gameLoop);
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowUp" || event.key === "ArrowDown") {
        event.preventDefault();
      }

      if (event.key in keys) {
        keys[event.key] = true;
      }
    });

    document.addEventListener("keyup", (event) => {
      if (event.key in keys) {
        keys[event.key] = false;
      }
    });

    canvas.addEventListener("mousemove", (event) => {
      const rect = canvas.getBoundingClientRect();
      const mouseY = event.clientY - rect.top;

      leftPaddle.y = mouseY - leftPaddle.height / 2;
      leftPaddle.y = Math.max(0, Math.min(canvas.height - leftPaddle.height, leftPaddle.y));
    });

    scoreLeftEl.textContent = leftPaddle.score;
    scoreRightEl.textContent = rightPaddle.score;
    resetBall(Math.random() < 0.5 ? -1 : 1);

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
