<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong Game</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0b1020;
      font-family: Arial, sans-serif;
      color: white;
    }

    .game-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .scoreboard {
      width: 900px;
      display: flex;
      justify-content: space-between;
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }

    canvas {
      background: #111827;
      border: 4px solid #e5e7eb;
      width: 900px;
      height: 500px;
      display: block;
      box-shadow: 0 0 16px rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <div class="scoreboard">
      <div id="leftScore">0</div>
      <div id="rightScore">0</div>
    </div>
    <canvas id="gameCanvas" width="900" height="500"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const leftScoreEl = document.getElementById("leftScore");
    const rightScoreEl = document.getElementById("rightScore");

    const paddleWidth = 14;
    const paddleHeight = 90;
    const paddleSpeed = 8;
    const ballRadius = 10;

    const leftPaddle = {
      x: 20,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      score: 0
    };

    const rightPaddle = {
      x: canvas.width - 20 - paddleWidth,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      score: 0
    };

    let ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: ballRadius,
      vx: 0,
      vy: 0
    };

    const keys = {
      ArrowUp: false,
      ArrowDown: false
    };

    function resetBall(direction) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;

      const angle = (Math.random() * 1.2) - 0.6;
      const baseSpeed = 6;

      ball.vx = direction * baseSpeed * Math.cos(angle);
      ball.vy = baseSpeed * Math.sin(angle);

      if (Math.abs(ball.vx) < 3) {
        ball.vx = direction * 5;
      }
    }

    function updateLeftPaddle() {
      if (keys.ArrowUp) leftPaddle.y -= paddleSpeed;
      if (keys.ArrowDown) leftPaddle.y += paddleSpeed;

      leftPaddle.y = Math.max(0, Math.min(canvas.height - leftPaddle.height, leftPaddle.y));
    }

    function updateRightPaddle() {
      const target = ball.y - rightPaddle.height / 2;
      rightPaddle.y += (target - rightPaddle.y) * 0.09;
      rightPaddle.y = Math.max(0, Math.min(canvas.height - rightPaddle.height, rightPaddle.y));
    }

    function rectangleCollision(paddle, side) {
      const paddleLeft = paddle.x;
      const paddleRight = paddle.x + paddle.width;
      const paddleTop = paddle.y;
      const paddleBottom = paddle.y + paddle.height;

      const hit =
        ball.x + ball.radius > paddleLeft &&
        ball.x - ball.radius < paddleRight &&
        ball.y + ball.radius > paddleTop &&
        ball.y - ball.radius < paddleBottom;

      if (!hit) return;

      const isLeft = side === "left";
      const movingTowardPaddle = isLeft ? ball.vx < 0 : ball.vx > 0;

      if (!movingTowardPaddle) return;

      const relativeIntersectY = (ball.y - (paddle.y + paddle.height / 2)) / (paddle.height / 2);
      const bounceAngle = relativeIntersectY * (Math.PI / 3);

      const speed = Math.hypot(ball.vx, ball.vy) + 0.8;
      const direction = isLeft ? 1 : -1;

      ball.vx = direction * speed * Math.cos(bounceAngle);
      ball.vy = speed * Math.sin(bounceAngle);

      if (isLeft) ball.x = paddleLeft + paddle.width + ball.radius;
      else ball.x = paddleRight - ball.radius;
    }

    function updateBall() {
      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.y - ball.radius <= 0) {
        ball.y = ball.radius;
        ball.vy *= -1;
      } else if (ball.y + ball.radius >= canvas.height) {
        ball.y = canvas.height - ball.radius;
        ball.vy *= -1;
      }

      rectangleCollision(leftPaddle, "left");
      rectangleCollision(rightPaddle, "right");

      if (ball.x - ball.radius <= 0) {
        rightPaddle.score++;
        rightScoreEl.textContent = rightPaddle.score;
        resetBall(1);
      } else if (ball.x + ball.radius >= canvas.width) {
        leftPaddle.score++;
        leftScoreEl.textContent = leftPaddle.score;
        resetBall(-1);
      }
    }

    function drawCenterLine() {
      ctx.setLineDash([12, 12]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.strokeStyle = "#e5e7eb";
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawPaddles() {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(leftPaddle.x, leftPaddle.y, leftPaddle.width, leftPaddle.height);
      ctx.fillRect(rightPaddle.x, rightPaddle.y, rightPaddle.width, rightPaddle.height);
    }

    function drawBall() {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#facc15";
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#111827";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawCenterLine();
      drawPaddles();
      drawBall();
    }

    function gameLoop() {
      updateLeftPaddle();
      updateRightPaddle();
      updateBall();
      draw();
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowUp" || event.key === "ArrowDown") {
        event.preventDefault();
      }
      if (event.key in keys) keys[event.key] = true;
    });

    document.addEventListener("keyup", (event) => {
      if (event.key in keys) keys[event.key] = false;
    });

    canvas.addEventListener("mousemove", (event) => {
      const rect = canvas.getBoundingClientRect();
      const mouseY = event.clientY - rect.top;
      leftPaddle.y = mouseY - leftPaddle.height / 2;
      leftPaddle.y = Math.max(0, Math.min(canvas.height - leftPaddle.height, leftPaddle.y));
    });

    leftScoreEl.textContent = leftPaddle.score;
    rightScoreEl.textContent = rightPaddle.score;
    resetBall(Math.random() < 0.5 ? -1 : 1);
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
